services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/genie.db
      - VECTOR_DB_PATH=/app/data/vectors.db
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_DIR=/app/data/images
    volumes:
      - ../data:/app/data
      - ../configs:/app/configs
