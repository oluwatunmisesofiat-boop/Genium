[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genie"
version = "0.1.0"
description = "GENIE AI — Product Intelligence & Verification Engine"
readme = "GENERAL_PLAN.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "httpcore>=1.0",
    "trafilatura>=1.8",
    "lxml>=5.0",
    "resiliparse>=0.14",
    "curl_cffi>=0.7",
    "ddgs>=6.0",
    "pypdfium2>=5.0",
    "pydantic>=2.6",
    "google-genai>=1.0",
    "Pillow>=10.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*", "registry*", "discovery*", "intelligence*", "validation*", "verification*", "orchestrator*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
